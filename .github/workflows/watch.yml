name: Watch queued videos

# Every 5 minutes, checks the shared Drive queue folder for new batch files,
# watches those videos, and saves frames + transcripts to reports/.
# A push that adds a file to queue/ (from a chat that can push) is processed too.
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "queue/*.txt"
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, so a batch is never processed twice.
concurrency:
  group: watch-queue
  cancel-in-progress: false

env:
  # Pinned to a reviewed commit of bradautomates/claude-video (MIT).
  # Only change this after the new version has been reviewed.
  CLAUDE_VIDEO_SHA: 03ceb42f7fa2c4439aca01752118044baabffb8f

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick batches to process
        env:
          QUEUE_FOLDER_ID: ${{ secrets.QUEUE_FOLDER_ID }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          files="$(python3 -I scripts/fetch_drive_queue.py | tr '\n' ' ')"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files="$files $(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'queue/*.txt' | tr '\n' ' ')"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files="$files $(ls queue/*.txt 2>/dev/null | tr '\n' ' ')"
          fi
          files="$(echo $files | tr ' ' '\n' | sort -u | tr '\n' ' ')"
          echo "BATCH_FILES=$files" >> "$GITHUB_ENV"
          echo "Batches: ${files:-none}"

      - name: Check out the video tool (pinned)
        if: env.BATCH_FILES != ''
        uses: actions/checkout@v4
        with:
          repository: bradautomates/claude-video
          ref: ${{ env.CLAUDE_VIDEO_SHA }}
          path: .tools/claude-video

      - name: Install ffmpeg and yt-dlp
        if: env.BATCH_FILES != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --upgrade "yt-dlp[default,curl-cffi]"

      - name: Process batches
        if: env.BATCH_FILES != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bash scripts/process_queue.sh $BATCH_FILES

      - name: Remove reports older than 60 days
        run: |
          cutoff="$(date -u -d '60 days ago' +%Y-%m)"
          for d in reports/*/ queue/*.txt; do
            [ -e "$d" ] || continue
            month="$(basename "$d" | cut -c1-7)"
            if [[ "$month" =~ ^[0-9]{4}-[0-9]{2}$ ]] && [[ "$month" < "$cutoff" ]]; then
              git rm -rq --ignore-unmatch "$d"
            fi
          done

      - name: Save results
        run: |
          git config user.name "format-scout-bot"
          git config user.email "format-scout-bot@users.noreply.github.com"
          git add -A queue reports
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -q -m "Update video breakdowns"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then
              echo "Saved."
              exit 0
            fi
            sleep $((attempt * 5 + RANDOM % 10))
          done
          echo "Could not save results after 6 attempts." >&2
          exit 1
